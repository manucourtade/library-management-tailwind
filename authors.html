<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="assets/output.css">
    <script src="js/api.js" defer></script>
    <script src="js/simpleCrud.js" defer></script>
    <title>Authors - Library Management System</title>
</head>

<body class="bg-gradient-to-r from-blue-200 via-cyan-50 to-gray-200 min-h-screen font-display">
    <div id="nav"></div>

    <main id="page" data-path="/authors" data-singular="author" data-plural="Authors" data-nav="authors" class="max-w-6xl mx-auto p-4 sm:p-8">
        <p id="notice" class="hidden"></p>

        <section id="formCard" class="hidden bg-gray-100 shadow-lg border border-cyan-50 rounded-xl p-6 mb-5">
            <h2 id="formTitle" class="text-2xl mb-4"></h2>
            <form id="itemForm" class="flex flex-col gap-4 sm:flex-row sm:items-end">
                <label class="flex flex-col gap-1 flex-1">Name
                    <input id="name" type="text" required class="p-3 border border-gray-300 rounded-xl outline-none focus:border-blue-400 w-full bg-white">
                </label>
                <div class="flex gap-3">
                    <button id="saveBtn" type="submit" class="text-white bg-gradient-to-br from-blue-500 to-blue-300 rounded-xl px-4 py-2 cursor-pointer border border-blue-100 hover:from-blue-700 hover:to-blue-500 transition-all duration-300 hover:shadow-lg disabled:opacity-50">Save</button>
                    <button id="cancelBtn" type="button" class="text-blue-500 border border-blue-300 rounded-xl px-4 py-2 cursor-pointer hover:bg-blue-700 hover:text-white transition-colors duration-300">Cancel</button>
                </div>
            </form>
        </section>

        <section class="bg-gray-100 shadow-lg border border-cyan-50 rounded-xl p-6 mb-5">
            <div class="flex flex-wrap items-center justify-between gap-4 mb-4">
                <h1 class="text-2xl">Authors</h1>
                <button id="newBtn" type="button" class="hidden text-white bg-gradient-to-br from-blue-500 to-blue-300 rounded-xl px-4 py-2 cursor-pointer border border-blue-100 hover:from-blue-700 hover:to-blue-500 transition-all duration-300 hover:shadow-lg disabled:opacity-50">New author</button>
            </div>
            <p id="readOnly" class="hidden text-sm text-gray-500 mb-4">Read-only access: only librarians can add, edit or delete.</p>
            <p id="loading">Loading... (if the server was idle it can take up to a minute)</p>
            <div class="overflow-x-auto">
                <table id="table" class="hidden w-full text-left">
                    <thead>
                        <tr class="border-b border-gray-300">
                            <th class="p-3">Name</th>
                            <th class="p-3">Books</th>
                            <th id="actionsHead" class="hidden p-3">Actions</th>
                        </tr>
                    </thead>
                    <tbody id="rows"></tbody>
                </table>
            </div>
            <p id="empty" class="hidden">Nothing here yet.</p>
        </section>
    </main>
</body>
</html>
