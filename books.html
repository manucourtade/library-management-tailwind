<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="assets/output.css">
    <script src="js/api.js" defer></script>
    <script src="js/books.js" defer></script>
    <title>Books - Library Management System</title>
</head>

<body class="bg-gradient-to-r from-blue-200 via-cyan-50 to-gray-200 min-h-screen font-display">
    <div id="nav"></div>

    <main class="max-w-6xl mx-auto p-4 sm:p-8">
        <p id="notice" class="hidden"></p>

        <section id="formCard" class="hidden bg-gray-100 shadow-lg border border-cyan-50 rounded-xl p-6 mb-5">
            <h2 id="formTitle" class="text-2xl mb-4">Add book</h2>
            <form id="bookForm" class="grid gap-4 md:grid-cols-2">
                <label class="flex flex-col gap-1">Title
                    <input id="title" type="text" maxlength="100" required class="p-3 border border-gray-300 rounded-xl outline-none focus:border-blue-400 w-full bg-white">
                </label>
                <label class="flex flex-col gap-1">ISBN
                    <input id="isbn" type="text" required class="p-3 border border-gray-300 rounded-xl outline-none focus:border-blue-400 w-full bg-white">
                </label>
                <label class="flex flex-col gap-1">Stock
                    <input id="stock" type="number" min="0" value="1" required class="p-3 border border-gray-300 rounded-xl outline-none focus:border-blue-400 w-full bg-white">
                </label>
                <label class="flex flex-col gap-1">Category
                    <select id="category" class="p-3 border border-gray-300 rounded-xl outline-none focus:border-blue-400 w-full bg-white"></select>
                </label>
                <label class="flex flex-col gap-1 md:col-span-2">Authors (hold Ctrl / Cmd to pick several)
                    <select id="authors" multiple size="5" class="p-3 border border-gray-300 rounded-xl outline-none focus:border-blue-400 w-full bg-white"></select>
                </label>
                <div class="flex gap-3 md:col-span-2">
                    <button id="saveBtn" type="submit" class="text-white bg-gradient-to-br from-blue-500 to-blue-300 rounded-xl px-4 py-2 cursor-pointer border border-blue-100 hover:from-blue-700 hover:to-blue-500 transition-all duration-300 hover:shadow-lg disabled:opacity-50">Save</button>
                    <button id="cancelBtn" type="button" class="text-blue-500 border border-blue-300 rounded-xl px-4 py-2 cursor-pointer hover:bg-blue-700 hover:text-white transition-colors duration-300">Cancel</button>
                </div>
            </form>
        </section>

        <section class="bg-gray-100 shadow-lg border border-cyan-50 rounded-xl p-6 mb-5">
            <div class="flex flex-wrap items-center justify-between gap-4 mb-4">
                <h1 class="text-2xl">Books</h1>
                <div class="flex flex-wrap gap-3">
                    <input id="search" type="search" placeholder="Search title, ISBN or author" class="p-3 border border-gray-300 rounded-xl outline-none focus:border-blue-400 w-full bg-white sm:w-72">
                    <button id="newBtn" type="button" class="hidden text-white bg-gradient-to-br from-blue-500 to-blue-300 rounded-xl px-4 py-2 cursor-pointer border border-blue-100 hover:from-blue-700 hover:to-blue-500 transition-all duration-300 hover:shadow-lg disabled:opacity-50">New book</button>
                </div>
            </div>
            <p id="readOnly" class="hidden text-sm text-gray-500 mb-4">Read-only access: only librarians can add, edit or delete books.</p>
            <p id="loading">Loading... (if the server was idle it can take up to a minute)</p>
            <div class="overflow-x-auto">
                <table id="table" class="hidden w-full text-left">
                    <thead>
                        <tr class="border-b border-gray-300">
                            <th class="p-3">Title</th>
                            <th class="p-3">ISBN</th>
                            <th class="p-3">Stock</th>
                            <th class="p-3">Category</th>
                            <th class="p-3">Authors</th>
                            <th id="actionsHead" class="hidden p-3">Actions</th>
                        </tr>
                    </thead>
                    <tbody id="rows"></tbody>
                </table>
            </div>
            <p id="empty" class="hidden">No books found.</p>
        </section>
    </main>
</body>
</html>
