<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="assets/output.css">
    <script src="/js/loginForm.js" defer></script>
    <title>System management bibliotecary</title>
</head>

<body class="bg-gradient-to-r from-blue-200 via-cyan-50 to-gray-200 min-h-screen  flex items-center">

    <header class="flex flex-col font-display lg:flex-row backdrop-blur shadow-lg
     bg-gray-100 rounded-xl p-10 pb-0 w-full xl:w-3/4 border border-cyan-50 mx-auto mt-5 lg:pt-16  animate-fade-in-up">
     
        <div class="p-10 flex justify-evenly gap-10 flex-col  h-auto">
            
            <span class="text-center text-2xl xl:text-3xl w-full
            border-b border-blue-200  justify-self-start rounded-xl lg:-mt-28 lg:pt-10 tracking-wider
              py-4 px-10 lg:px-26">Management library</span>
            
              <form action=""  id="loginForm" class="flex flex-col  gap-3">
                <label class="text-xl" for="Username">Username</label>
                <input id="username" class="mb-10  p-4 border border-gray-300 rounded-2xl outline-none
                 focus:border-blue-400 hover:bg-gray-200 transition-colors duration-300" type="text" name="Username" id="" placeholder="ex: manucourtade">
                
                <label class="text-xl" for="password">Password</label>
                <input id="password" class="mb-10 p-4 rounded-2xl border border-gray-300 outline-none focus:border-blue-400
                 hover:bg-gray-200 transition-colors duration-300" type="password" name="Password" id="" placeholder="Enter password">
                <button type="submit" class="text-white text-lg bg-gradient-to-br from-blue-500 to-blue-300 self-center 
                rounded-2xl px-4 py-5 mb-10 justify-items-end my-5
                  cursor-pointer border border-blue-100 w-full
                  hover:bg-gradient-to-br hover:from-blue-700 hover:to-blue-500 duration-600 
                  hover:animate-slide-out-right transition-all ease-out hover:translate-x-10 hover:shadow-lg">
                    Log in</button>
            </form>
        <div class="flex flex-col md:flex-row justify-center md:justify-around items-center gap-6 px-5 text-white text-center">
            <a href="/register.html" class=" text-blue-400  py-4  px-10 border rounded-full hover:bg-blue-700 hover:shadow-lg hover:text-white transition-colors duration-300">Register</a>
            <a href="#" class=" text-blue-400 py-4  px-4  border rounded-full hover:bg-blue-700 hover:shadow-lg hover:text-white transition-colors duration-300">I forget my password</a>
        </div>
        </div>

        <img src="assets/library-img.jpg" alt="Library image log-in" 
        class="mask-radial-from-0% mask-radial-to-75% justify-center self-center  md:w-md w-full mx-10 rounded-lg">
     
        
    </header>
</body>
</html>
